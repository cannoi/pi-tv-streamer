services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SHFH_HUB_ID: ${SHFH_HUB_ID:-}
      SHFH_HUB_URL: ${SHFH_HUB_URL:-}
      SHFH_INGEST_TOKEN: ${SHFH_INGEST_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
    volumes:
      - ./data:/app/data

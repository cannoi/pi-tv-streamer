services:
  app:
    image: ${IMAGE_TAG:-pi-vintage-tv:local}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SOLOHOST_PUBLIC_URL: ${SOLOHOST_PUBLIC_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - app-data:/app/data
volumes:
  app-data:
